services:
  solix-monitor:
    build: .
    container_name: solix-monitor
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      TZ: Europe/Berlin
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app/solix_web_dashboard/src:/app/solix_web_dashboard/src/api"

    volumes:
      # Credentials/config from host
      - ./config:/app/solix_web_dashboard/config:ro

      # Persistent time-series data, served by the webserver below /exports/timeseries
      - ./data/timeseries:/app/solix_web_dashboard/src/dashboard/exports/timeseries

    command:
      [
        "python",
        "/app/solix_web_dashboard/src/api/pv_monitor.py",
        "--live-cloud",
        "--energy-stats",
        "--interval",
        "6",
        "--sample-interval",
        "3",
        "--storage-root",
        "/app/solix_web_dashboard/src/dashboard/exports/timeseries",
        "--web-folder",
        "/app/solix_web_dashboard/src/dashboard",
        "--web-host",
        "0.0.0.0",
        "--web-port",
        "8080",
        "--config",
        "/app/solix_web_dashboard/config/solix-monitor.config.json",
        "--console-detail",
        "compact",
        "--console-log-level",
        "INFO",
        "--dashboard-light"
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s