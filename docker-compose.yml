services:
  solix-monitor:
    build: .
    container_name: solix-monitor
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      TZ: Europe/Berlin
      PYTHONUNBUFFERED: "1"

    volumes:
      # Credentials/config from host
      - ./config/solix-monitor.config.json:/app/config/solix-monitor.config.json:ro

      # Persistent time-series data, served by the webserver below /exports/timeseries
      - ./data/timeseries:/app/sdashboard/exports/timeseries

    command:
      [
        "python",
        "src/api/pv_monitor.py",
        "--live-cloud",
        "--energy-stats",
        "--interval",
        "30",
        "--sample-interval",
        "10",
        "--storage-root",
        "/app/src/dashboard/exports/timeseries",
        "--web-folder",
        "/app/src/dashboard",
        "--web-host",
        "0.0.0.0",
        "--web-port",
        "8080",
        "--config",
        "/app/config/solix-monitor.config.json",
        "--console-detail",
        "compact",
        "--console-log-level",
        "INFO"
      ]